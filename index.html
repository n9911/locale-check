<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1c665c"><title>Locale Check</title><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><script src="./boot.js" data-tool="locale-check"></script><link rel="stylesheet" href="./style.css"></head>
<body data-tool="locale-check"><button id="sidebar-toggle" class="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" data-copy="menu">Меню</button>
<aside id="sidebar"><a class="brand" href="./"><img src="./icon.svg" width="44" height="44" alt=""><span>Locale Check</span></a>
<nav aria-label="Navigation"><span class="nav-label" data-copy="navigation">Разделы</span><a href="#input" data-copy="input">Исходные данные</a><a href="#output" data-copy="output">Результат</a><a href="#local-storage" data-copy="local">Локальные данные</a></nav>
<div class="preferences"><label><span data-copy="language">Язык</span><select id="language"><option value="ru">Русский</option><option value="en">English</option><option value="es">Español</option></select></label>
<label><span data-copy="theme">Оформление</span><select id="theme"><option value="system" data-copy="system">Как в системе</option><option value="light" data-copy="light">Светлое</option><option value="dark" data-copy="dark">Тёмное</option></select></label></div>
<p id="privacy" data-copy="privacy"></p><p id="boundary"></p><a href="http://127.0.0.1:8780/" data-copy="launchpad">Каталог проектов</a><p id="connection" class="connection" role="status"></p><button id="install" type="button" hidden></button><button id="update" type="button" hidden></button></aside>
<main><header><div class="project-mark"><img src="./icon.svg" width="64" height="64" alt=""><h1 id="title">Locale Check</h1></div><p id="description"></p></header><div id="file-notice" hidden>Start.cmd · sh start.sh</div>
<div class="workspace"><section id="input"><div class="section-head"><h2 id="input-title" data-copy="input">Исходные данные</h2><button id="example" type="button">Пример</button></div><form id="form"><div id="fields"></div><div class="actions"><button id="run" type="submit">Обработать</button></div></form></section>
<section id="output"><div class="section-head"><h2 id="output-title" data-copy="output">Результат</h2><button id="export" type="button" disabled>Экспорт JSON</button></div><p id="status" role="status" aria-live="polite"></p><div id="downloads"></div><div id="table"></div><pre id="text"></pre><div id="preview"></div></section></div>
<section id="local-storage" class="storage-panel"><h2 data-copy="local">Локальные данные</h2><p id="storage-note" data-copy="storage"></p><label class="checkbox"><input id="include-files" type="checkbox"><span data-copy="include">Сохранить также выбранные файлы</span></label><div class="actions"><button id="save" type="button">Сохранить проект</button><button id="restore" type="button">Открыть сохранённый</button><button id="clear" type="button">Удалить сохранённый</button></div><p data-copy="savedFiles"></p><p id="storage-usage" role="status"></p><button id="persist" type="button">Запросить постоянное хранение</button></section></main>
<script type="module" src="./app.mjs"></script></body></html>
